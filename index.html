<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#eeede9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SHF360">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>SHF360</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f2;--panel:#fff;--text:#1d1d1b;--muted:#6b6b66;--line:#d9d9d4;--accent:#e8730c;--accent-t:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--panel:#222220;--text:#efefea;--muted:#9a9a93;--line:#3a3a36}}
:root[data-theme="dark"]{--bg:#161615;--panel:#222220;--text:#efefea;--muted:#9a9a93;--line:#3a3a36}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 auto 0 0}
button,label.btn{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
button.pri{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,42%) 1fr;gap:8px;padding:8px}
@media (max-width:800px){main{grid-template-columns:1fr;grid-template-rows:45% 55%}}
.left{display:flex;flex-direction:column;gap:8px;min-height:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
input,select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;max-width:160px}
#st{font-size:12px;color:var(--muted)}
#mapWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px;position:relative}
#map{position:relative;max-width:100%;max-height:100%;touch-action:none}
#map img{display:block;max-width:100%;max-height:100%;user-select:none;-webkit-user-drag:none}
#hint{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:5;background:var(--accent);color:var(--accent-t);padding:3px 10px;border-radius:8px;font-size:12px;white-space:nowrap;pointer-events:none;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);text-align:center;padding:16px}
.pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;cursor:grab;touch-action:none;z-index:2;box-shadow:0 1px 4px #0006}
.pin.on{background:#0a7cff;z-index:3;transform:scale(1.2)}
.cone{position:absolute;left:50%;top:50%;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;pointer-events:none;background:conic-gradient(from -28deg,#0a7cff99 0 56deg,transparent 56deg);z-index:-1;display:none}
.pin.on .cone{display:block}
.pin.un .cone{filter:grayscale(1)}
#list{display:flex;gap:6px;overflow-x:auto;padding:6px;min-height:92px}
.th{flex:none;width:110px;position:relative;border:2px solid transparent;border-radius:8px;cursor:pointer;overflow:hidden;background:var(--bg)}
.th.sel{border-color:var(--accent)}
.th img{width:100%;height:55px;object-fit:cover;display:block}
.th span{display:block;font-size:11px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.th b{position:absolute;top:2px;left:2px;background:var(--accent);color:#fff;border-radius:10px;padding:0 6px;font-size:11px}
.th i{position:absolute;top:2px;right:2px;background:#000a;color:#fff;border-radius:10px;width:18px;height:18px;text-align:center;font-style:normal;font-size:12px;line-height:18px}
#view{position:relative;background:#000;min-height:0}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.hud{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;justify-content:center;align-items:center;padding:10px;background:linear-gradient(transparent,#000a)}
.hud button{background:#000a;color:#fff;border-color:#fff4}
#ttl{position:absolute;top:8px;left:10px;color:#fff;background:#000a;padding:3px 10px;border-radius:8px;font-size:13px}
#xh{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:34px;font-weight:200;text-shadow:0 0 3px #000;pointer-events:none}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ddd;text-align:center;padding:20px;pointer-events:none}
:root{--bg:#eeede9;--panel:#fff;--text:#1b1b19;--muted:#74736d;--line:#e1dfd8;--soft:#f6f5f1;--accent:#fa4a00;--accent-t:#fff;--shadow:0 1px 2px #0000000d,0 6px 20px #0000000f;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f0e;--panel:#1b1b19;--text:#f1f0ea;--muted:#9c9b93;--line:#2e2e2b;--soft:#232321;--shadow:0 1px 2px #0006,0 8px 24px #0005;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0f0e;--panel:#1b1b19;--text:#f1f0ea;--muted:#9c9b93;--line:#2e2e2b;--soft:#232321;--shadow:0 1px 2px #0006,0 8px 24px #0005;color-scheme:dark}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{gap:10px;padding:10px 14px;border-bottom:0;box-shadow:var(--shadow);position:relative;z-index:5}
h1{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0 8px 0 0}
.logo{font-style:normal;background:linear-gradient(135deg,#ffa043,var(--accent));color:#fff;font-size:11px;font-weight:700;border-radius:10px;width:34px;height:34px;display:grid;place-items:center;box-shadow:0 2px 8px #fa4a0055}
.grp{display:flex;gap:4px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:4px}
.grp button,.grp label.btn,.grp input,.grp select{background:transparent;border-color:transparent}
.grp input{width:150px}
button,label.btn{border-radius:10px;font-weight:500;transition:background .15s,border-color .15s,transform .08s}
button:hover:not(:disabled),label.btn:hover{background:var(--soft);border-color:var(--line)}
.grp button:hover:not(:disabled),.grp label.btn:hover{background:var(--panel)}
button:active:not(:disabled){transform:scale(.97)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-t);font-weight:600;box-shadow:0 2px 10px #fa4a0044}
button.pri:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
button.pri:disabled{box-shadow:none}
#st{flex:1;text-align:right;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{gap:12px;padding:12px}
.box{border-radius:16px;box-shadow:var(--shadow)}
#mapWrap{background-color:var(--soft);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:16px 16px;padding:12px}
#map{border-radius:8px;box-shadow:0 6px 24px #0003;background:#fff}
#map img{border-radius:8px}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:280px;line-height:1.5;margin:auto}
.empty .ico{font-size:36px;opacity:.7}
.empty b{color:var(--text);font-size:15px}
#list{padding:10px;gap:10px;min-height:120px;scrollbar-width:thin}
#list .empty{flex-direction:row}
.pin{width:30px;height:30px;margin:-15px 0 0 -15px;border:3px solid #fff;box-shadow:0 2px 8px #0005;transition:transform .15s}
.pin:hover{transform:scale(1.12)}
.pin.on{background:#1a73ff;transform:scale(1.2);box-shadow:0 0 0 6px #1a73ff44,0 2px 8px #0006}
.cone{width:120px;height:120px;margin:-60px 0 0 -60px;-webkit-mask-image:radial-gradient(circle,transparent 14px,#000 18px,transparent 60px);mask-image:radial-gradient(circle,transparent 14px,#000 18px,transparent 60px)}
.th{width:132px;border-radius:12px;background:var(--soft);box-shadow:0 1px 3px #0002;transition:transform .15s,border-color .15s}
.th:hover{transform:translateY(-2px)}
.th img{height:70px}
.th.sel{border-color:var(--accent);box-shadow:0 0 0 3px #fa4a0033}
.th.np{border-style:dashed;border-color:var(--line)}
.th.np.sel{border-color:var(--accent)}
.th.np img{filter:grayscale(.7) opacity(.8)}
.th span{padding:5px 8px;font-size:12px;color:var(--text)}
.th b{top:6px;left:6px;padding:1px 8px;box-shadow:0 1px 4px #0005}
.th i{top:6px;right:6px;opacity:0;transition:opacity .15s}
.th:hover i{opacity:1}
@media (hover:none){.th i{opacity:.85}}
#hint{top:10px;border-radius:999px;padding:5px 14px;font-weight:500;box-shadow:0 4px 14px #fa4a0055}
#view{border-radius:16px;background:radial-gradient(circle at 50% 40%,#2a2a28,#0c0c0b)}
#ttl{top:12px;left:12px;background:#0008;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid #fff2;padding:5px 14px;border-radius:999px;font-weight:500}
.hud{padding:16px 14px;gap:8px;background:linear-gradient(transparent,#0009)}
.hud button{background:#0007;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid #fff3;border-radius:999px;padding:8px 16px;color:#fff}
.hud button:hover:not(:disabled){background:#000b;border-color:#fff6}
#msg{flex-direction:column;gap:8px;font-size:14px}
#msg[hidden]{display:none}
#msg::before{content:"◎";font-size:52px;line-height:1;opacity:.35}
@media (max-width:800px){main{grid-template-rows:42% 1fr;padding:8px;gap:8px}.grp.proj{flex:1 1 100%}.grp.proj input{flex:1;width:auto;max-width:none;min-width:0}#st{display:none}}
#tabs{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;flex:none;padding:2px 2px 4px}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:6px 14px;font:inherit;font-weight:500;flex:none;box-shadow:var(--shadow)}
input.tab{background:var(--accent);color:var(--accent-t);border-color:var(--accent);text-align:center;width:auto;max-width:none;padding:6px 14px}
.tab.add{border-style:dashed;color:var(--muted);background:transparent;box-shadow:none}
.tab.del{border-color:transparent;background:transparent;box-shadow:none;padding:6px 10px}
#phases{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;flex:none;padding:0 2px 4px}
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex:none;margin-right:2px}
input.tab.ph{background:var(--text);color:var(--bg);border-color:var(--text)}
.tab.ph{padding:5px 12px;font-size:13px}
#cv{transition:opacity .25s}
#hs{position:absolute;inset:0;pointer-events:none;overflow:hidden;transition:opacity .2s}
.hs{position:absolute;left:0;top:0;padding:0;border-radius:50%;border:3px solid #fff;background-size:cover;background-position:center;background-color:#333;cursor:pointer;pointer-events:auto;box-shadow:0 2px 14px #000a}
.hs:hover:not(:disabled){border-color:var(--accent);filter:brightness(1.15)}
.hs span{position:absolute;right:-6px;top:-6px;background:var(--accent);color:#fff;border-radius:10px;font-size:11px;font-weight:700;padding:1px 6px;pointer-events:none}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border-color:transparent;background:transparent}
.seg button.on{background:var(--panel);border-color:var(--line);box-shadow:var(--shadow);font-weight:600}
.seg b{background:var(--accent);color:#fff;border-radius:10px;padding:0 7px;font-size:11px;margin-left:6px}
main[hidden],#snaps[hidden]{display:none}
#snaps{flex:1;min-height:0;overflow:auto;padding:12px}
#sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;align-items:start}
#sgrid .empty{grid-column:1/-1;margin:60px auto}
.sc{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.sc img{width:100%;display:block;aspect-ratio:16/10;object-fit:cover;background:#000}
.sb{padding:10px;display:flex;flex-direction:column;gap:8px}
.sb input{width:100%;max-width:none;border-color:var(--line)}
.sm{font-size:12px;color:var(--muted)}
.sa{display:flex;gap:6px}
.sa .dl{flex:1}
#toast{position:absolute;top:56px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:6px 14px;border-radius:999px;font-size:13px;z-index:6;white-space:nowrap}

html{overscroll-behavior:none}
body{height:100dvh;-webkit-tap-highlight-color:transparent}
#hctl{display:contents}
#bMenu,#nav{display:none}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:50}
#iosHint{font-size:12px;color:var(--muted)}
#nav{background:var(--panel);border-top:1px solid var(--line);padding:4px 6px;gap:4px}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:transparent;color:var(--muted);padding:5px 0;border-radius:10px;min-height:50px}
#nav button i{font-style:normal;font-size:20px;line-height:1.1}
#nav button span{font-size:11px}
#nav button.on{color:var(--accent);font-weight:600;background:var(--soft)}
@media (pointer:coarse){button,label.btn,.tab{min-height:44px}input,select{font-size:16px}.hud button{min-height:44px}}
@media (max-width:800px){
  header{flex-wrap:nowrap;padding:8px 12px}
  header h1{margin:0}
  .seg{display:none}
  #bMenu{display:inline-block;margin-left:auto;font-size:18px;padding:6px 14px}
  #hctl{display:none;position:absolute;top:100%;left:0;right:0;background:var(--panel);box-shadow:0 12px 30px #0004;padding:12px;flex-direction:column;align-items:stretch;gap:10px;z-index:20;max-height:75dvh;overflow:auto}
  header.open #hctl{display:flex}
  #hctl .grp{flex-wrap:wrap}
  #hctl #st{display:block;text-align:left;white-space:normal}
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr);padding:8px;gap:8px}
  main[data-pane="plan"] #view{display:none}
  main[data-pane="view"] .left{display:none}
  #nav{display:flex}
  .hud{gap:6px;padding:10px 8px}
  .hud button{padding:8px 12px}
  .th{width:118px}
  #sgrid{grid-template-columns:1fr}
}
.brand{height:34px;width:auto;display:block;background:#fff;border-radius:9px;padding:3px 9px;box-shadow:0 1px 3px #0002}
@media (max-width:800px){.brand{height:30px}}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
let proj=null,floors=[],fl=null,phases=[],pc=null,aligning=false;
let snaps=[],sid=0,tt,photos=[],walk=[],sel=null,cur=null,playing=false,timer=null,uid=0;

// ---------- 360 viewer ----------
const cv=$('#cv'),renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(75,1,1,1100);
const geo=new THREE.SphereGeometry(500,64,40);geo.scale(-1,1,1);
const mat=new THREE.MeshBasicMaterial({color:0x222222});
scene.add(new THREE.Mesh(geo,mat));
let lon=0,lat=0,fov=75,tex=null;
function draw(){
  lat=Math.max(-85,Math.min(85,lat));
  const p=THREE.MathUtils.degToRad(90-lat),t=THREE.MathUtils.degToRad(lon);
  cam.fov=fov;cam.updateProjectionMatrix();
  cam.lookAt(500*Math.sin(p)*Math.cos(t),500*Math.cos(p),500*Math.sin(p)*Math.sin(t));
  renderer.render(scene,cam);
}
function loop(){
  draw();updHs();
  const c=document.querySelector('.pin.on .cone');if(c){const q=photos.find(p=>p.id===cur);c.style.transform='rotate('+(lon+(q&&q.rot||0))+'deg)'}
  requestAnimationFrame(loop);
}
function resize(){const r=$('#view').getBoundingClientRect();if(!r.width||!r.height)return;renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(r.width,r.height,false);cam.aspect=r.width/r.height}
new ResizeObserver(resize).observe($('#view'));
let drag=null;
const ptrs=new Map();let pd=0;
const pdist=()=>{const a=[...ptrs.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);if(ptrs.size===2){pd=pdist();drag=null}else drag={x:e.clientX,y:e.clientY,lon,lat}});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2){const d=pdist();if(d>0&&pd>0)fov=Math.max(30,Math.min(100,fov*pd/d));pd=d;return}
  if(!drag)return;const k=fov/600;lon=drag.lon-(e.clientX-drag.x)*k;lat=drag.lat+(e.clientY-drag.y)*k});
const pup=e=>{ptrs.delete(e.pointerId);if(ptrs.size===1){const p=[...ptrs.values()][0];drag={x:p[0],y:p[1],lon,lat}}else if(!ptrs.size)drag=null};
cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',pup);

async function bitmap(file,w){

}

function buildMap(){
  const w=$('#mapWrap');w.innerHTML='';
  if(!plan()){w.appendChild($('#mapEmpty')||Object.assign(document.createElement('div'),{className:'empty',innerHTML:'<div class="ico">🗺</div><b>Grundriss laden</b>Dann ein Foto unten wählen und auf den Plan tippen, um es zu platzieren.'}));return}
  const m=document.createElement('div');m.id='map';
  const im=new Image();im.src=plan();im.draggable=false;m.appendChild(im);w.appendChild(m);
  m.addEventListener('click',e=>{
    if(e.target.closest('.pin'))return;
    if(aligning){
      const q=photos.find(p=>p.id===cur);
      if(q&&q.x!=null){
        const r=m.getBoundingClientRect();
        const dx=((e.clientX-r.left)/r.width-q.x)*r.width,dy=((e.clientY-r.top)/r.height-q.y)*r.height;
        if(Math.hypot(dx,dy)>8){q.rot=Math.atan2(dx,-dy)*180/Math.PI-lon;aligning=false;dirty();ui();if(mobile())pane('view')}
      }
      return;
    }
    const ph=target();if(!ph)return;
    const r=m.getBoundingClientRect();
    ph.x=(e.clientX-r.left)/r.width;ph.y=(e.clientY-r.top)/r.height;
    walk.push(ph.id);dirty();
    const nx=fp().find(p=>p.x==null);sel=nx?nx.id:ph.id;
    ui();
  });
  const h=document.createElement('div');h.id='hint';w.appendChild(h);
  ui();
}
const plan=()=>{const F=floors.find(x=>x.id===fl);return F&&F.url};
const wf=()=>walk.filter(id=>{const p=photos.find(q=>q.id===id);return p&&p.fl===fl&&p.pz===pc});
const fp=()=>photos.filter(p=>p.fl===fl&&p.pz===pc);
function mapSize(){const m=$('#map');return m?m.getBoundingClientRect():{width:1,height:1}}
function ang(a,b){const r=mapSize();return Math.atan2((b.x-a.x)*r.width,-(b.y-a.y)*r.height)*180/Math.PI}
function dst(a,b){const r=mapSize(),M=Math.max(r.width,r.height)||1;return Math.hypot((b.x-a.x)*r.width,(b.y-a.y)*r.height)/M}
let hsl=[];
function buildHs(){
  const H=$('#hs');H.innerHTML='';hsl=[];
  const c=photos.find(p=>p.id===cur);
  if(!c||c.x==null)return;
  fp().filter(p=>p.id!==cur&&p.x!=null).map(p=>({p,a:ang(c,p),d:dst(c,p)})).sort((u,v)=>u.d-v.d).slice(0,8).forEach(o=>{
    const b=document.createElement('button');b.className='hs';
    b.style.backgroundImage='url('+o.p.thumb+')';
    b.title=o.p.name;b.innerHTML='<span>'+(wf().indexOf(o.p.id)+1)+'</span>';
    b.onclick=()=>go(o.p.id);
    const s=Math.round(Math.max(38,Math.min(66,70-o.d*90)));
    b.style.width=b.style.height=s+'px';
    H.appendChild(b);
    hsl.push({b,lon:o.a-(c.rot||0),lat:-Math.max(6,Math.min(30,26-o.d*40)),s});
  });
}
const hv=new THREE.Vector3(),hd=new THREE.Vector3();
function updHs(){
  if(!hsl.length)return;
  const W=cv.clientWidth,Hh=cv.clientHeight;
  cam.getWorldDirection(hd);
  hsl.forEach(h=>{
    const p=THREE.MathUtils.degToRad(90-h.lat),t=THREE.MathUtils.degToRad(h.lon);
    hv.set(Math.sin(p)*Math.cos(t),Math.cos(p),Math.sin(p)*Math.sin(t));
    if(hv.dot(hd)<=0.05){h.b.style.display='none';return}
    hv.multiplyScalar(500).project(cam);
    h.b.style.display='';
    h.b.style.transform='translate('+((hv.x*.5+.5)*W-h.s/2)+'px,'+((-hv.y*.5+.5)*Hh-h.s/2)+'px)';
  });
}

// ---------- Speichern (IndexedDB) ----------
const idb=new Promise((res,rej)=>{const r=indexedDB.open('baustelle360',1);r.onupgradeneeded=()=>{r.result.createObjectStore('meta',{keyPath:'name'});r.result.createObjectStore('blob')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tdone=t=>new Promise((res,rej)=>{t.oncomplete=res;t.onerror=t.onabort=()=>rej(t.error)});
const bk=(n,k)=>n+'\u0000'+k;
const status=t=>{$('#st').textContent=t;if(mobile())toast(t)};
let dt;
function dirty(){if(!proj)return;clearTimeout(dt);dt=setTimeout(()=>save(proj),1000)}
async function save(name){
  if(!name){status('Bitte Projektnamen eingeben');return}
  try{
    const d=await idb;
    if(proj&&proj!==name){photos.forEach(p=>p.saved=false);floors.forEach(f=>f.saved=false);snaps.forEach(s=>s.saved=false)}
    const t=d.transaction(['meta','blob'],'readwrite'),b=t.objectStore('blob');
    floors.forEach(f=>{if(f.file&&!f.saved)b.put(f.file,bk(name,'plan'+f.id))});
    snaps.forEach(s=>{if(!s.saved)b.put(s.blob,bk(name,'s'+s.id))});
    photos.forEach(p=>{if(!p.saved)b.put(p.file,bk(name,p.id))});
    t.objectStore('meta').put({name,uid,walk,floors:floors.map(f=>({id:f.id,name:f.name})),fl,phases:phases.map(p=>({id:p.id,name:p.name})),pc,sid,snaps:snaps.map(s=>({id:s.id,note:s.note,t:s.t,fl:s.fl,ph:s.ph,src:s.src})),updated:Date.now(),photos:photos.map(p=>({id:p.id,name:p.name,thumb:p.thumb,x:p.x,y:p.y,rot:p.rot,fl:p.fl,pz:p.pz}))});
    await tdone(t);
    photos.forEach(p=>p.saved=true);floors.forEach(f=>f.saved=true);snaps.forEach(s=>s.saved=true);proj=name;
    status('Gespeichert '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
    list();
  }catch(e){status('Speichern fehlgeschlagen: '+(e&&e.message||e))}
}
async function list(){
  const d=await idb;
  const all=await rq(d.transaction('meta').objectStore('meta').getAll());
  const s=$('#plist');
  s.innerHTML='<option value="">Gespeicherte Projekte …</option>'+all.sort((a,b)=>b.updated-a.updated).map(m=>'<option>'+m.name.replace(/</g,'&lt;')+'</option>').join('');
  if(proj)s.value=proj;
}
function applyProj(m,blobs,name){
    const fls=m.floors||[{id:1,name:'EG',old:true}];
    const phs=m.phases||[{id:1,name:'Bauphase 1'}];
    for(const f of fls){const fb=blobs[bk(name,f.old?'plan':'plan'+f.id)];f.file=fb||null;f.saved=!f.old;f.url=fb?URL.createObjectURL(fb):null}
    const ps=[];
    for(const p of m.photos)ps.push({...p,fl:p.fl??fls[0].id,pz:p.pz??phs[0].id,file:blobs[bk(name,p.id)],saved:true});
    setPlay(false);
    floors.forEach(f=>f.url&&URL.revokeObjectURL(f.url));
    floors=fls;fl=(fls.find(f=>f.id===m.fl)||fls[0]).id;
    phases=phs;pc=(phs.find(x=>x.id===m.pc)||phs[phs.length-1]).id;
    snaps.forEach(s=>URL.revokeObjectURL(s.url));
    snaps=(m.snaps||[]).map(s=>({...s,blob:blobs[bk(name,'s'+s.id)],saved:true})).filter(s=>s.blob).map(s=>({...s,url:URL.createObjectURL(s.blob)})).sort((a,b)=>b.t-a.t);
    sid=m.sid||0;snRender();
    photos=ps.filter(p=>p.file);walk=m.walk.filter(id=>photos.some(p=>p.id===id));
    uid=m.uid;sel=null;cur=null;proj=name;$('#pname').value=name;
    $('#ttl').hidden=true;mat.map=null;mat.color.set(0x222222);mat.needsUpdate=true;
    $('#msg').textContent='Foto wählen oder auf einen Pin tippen';$('#msg').hidden=false;
    buildMap();
}
async function load(){
  const name=$('#plist').value;if(!name)return;
  try{
    const d=await idb,t=d.transaction(['meta','blob']),b=t.objectStore('blob');
    const rng=IDBKeyRange.bound(name+'\u0000',name+'\u0000\uffff');
    const [m,bkeys,bvals]=await Promise.all([rq(t.objectStore('meta').get(name)),rq(b.getAllKeys(rng)),rq(b.getAll(rng))]);
    if(!m)throw new Error('Projekt nicht gefunden');
    const blobs={};bkeys.forEach((k,i)=>blobs[k]=bvals[i]);
    applyProj(m,blobs,name);status('Geöffnet');
  }catch(e){status('Öffnen fehlgeschlagen: '+(e&&e.message||e))}
}
$('#bSave').onclick=()=>save($('#pname').value.trim());
$('#bOpen').onclick=load;
let armed=false;
$('#bDel').onclick=async()=>{
  const name=$('#plist').value;if(!name)return;
  if(!armed){armed=true;$('#bDel').textContent='Sicher?';setTimeout(()=>{armed=false;$('#bDel').textContent='🗑'},3000);return}
  armed=false;$('#bDel').textContent='🗑';
  const d=await idb,t=d.transaction(['meta','blob'],'readwrite');
  t.objectStore('meta').delete(name);
  t.objectStore('blob').delete(IDBKeyRange.bound(name+'\u0000',name+'\u0000\uffff'));
  await tdone(t);if(proj===name)proj=null;list();status('Gelöscht');
};

// ---------- Handy / Export / Installieren ----------
const mobile=()=>matchMedia('(max-width:800px)').matches;
function pane(p){
  const M=$('main');
  if(p==='snaps')tab('sn');else{tab('ph');M.dataset.pane=p}
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  $('header').classList.remove('open');
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>pane(b.dataset.p));
$('#bMenu').onclick=()=>$('header').classList.toggle('open');
async function saveFile(blob,name,share){
  try{
    const D=window.claude?await claude.use('downloads'):null;
    if(D){await D.save({filename:name,data:blob});return}
    if(share&&navigator.canShare){
      const f=new File([blob],name,{type:blob.type});
      if(navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}
    }
    const u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),5000);
  }catch(e){
    if(e&&e.code==='rejected_extension')status('Export nur in der installierten App m\u00f6glich');
    else if(!e||(e.code!=='declined'&&e.name!=='AbortError'))status('Datei speichern fehlgeschlagen');
  }
}
function exportProj(){
  const name=$('#pname').value.trim()||proj||'Projekt';
  const files=[],parts=[];
  const add=(key,b)=>{if(b){files.push({key,size:b.size,type:b.type||''});parts.push(b)}};
  floors.forEach(f=>add('plan'+f.id,f.file));
  photos.forEach(p=>add(String(p.id),p.file));
  snaps.forEach(s=>add('s'+s.id,s.blob));
  const meta={v:1,name,uid,sid,walk,fl,pc,files,
    floors:floors.map(f=>({id:f.id,name:f.name})),
    phases:phases.map(p=>({id:p.id,name:p.name})),
    photos:photos.map(p=>({id:p.id,name:p.name,thumb:p.thumb,x:p.x,y:p.y,rot:p.rot,fl:p.fl,pz:p.pz})),
    snaps:snaps.map(s=>({id:s.id,note:s.note,t:s.t,fl:s.fl,ph:s.ph,src:s.src}))};
  const js=new TextEncoder().encode(JSON.stringify(meta));
  const hd=new Uint8Array(4);new DataView(hd.buffer).setUint32(0,js.length);
  saveFile(new Blob([hd,js,...parts]),name.replace(/[^A-Za-z0-9äöüÄÖÜß.-]+/g,'_')+'.b360',false);
}
async function importProj(file){
  try{
    const n=new DataView(await file.slice(0,4).arrayBuffer()).getUint32(0);
    const m=JSON.parse(await file.slice(4,4+n).text());
    let off=4+n;const blobs={};
    m.files.forEach(f=>{blobs[bk(m.name,f.key)]=file.slice(off,off+f.size,f.type||'image/jpeg');off+=f.size});
    applyProj(m,blobs,m.name);
    photos.forEach(p=>p.saved=false);floors.forEach(f=>f.saved=false);snaps.forEach(s=>s.saved=false);
    proj=null;await save(m.name);status('Importiert: '+m.name);
  }catch(e){status('Import fehlgeschlagen: '+(e&&e.message||e))}
}
$('#bExp').onclick=exportProj;
$('#fImp').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importProj(f)};
let inst;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();inst=e;$('#bInst').hidden=false});
$('#bInst').onclick=async()=>{if(!inst)return;inst.prompt();try{await inst.userChoice}catch(_){}inst=null;$('#bInst').hidden=true};
if(/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone)$('#iosHint').hidden=false;

resize();loop();ui();snRender();list().catch(()=>{});
try{navigator.storage.persist()}catch(e){}
